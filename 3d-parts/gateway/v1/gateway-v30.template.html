<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
#gateway-v30{font-family:var(--font-sans);color:var(--foreground)}#gateway-v30 .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}#gateway-v30 canvas{display:block;width:100%;height:520px;touch-action:none;cursor:grab}#gateway-v30 .note{color:var(--muted-foreground);margin-top:6px}
</style></head><body><div id="gateway-v30"><div class="controls"><label class="form-check"><input class="form-check-input" id="v30-ant" type="checkbox" checked><span class="form-check-label">Antenne</span></label><label class="form-check"><input class="form-check-input" id="v30-case" type="checkbox" checked><span class="form-check-label">Gehäuse</span></label><label class="form-check"><input class="form-check-input" id="v30-lid" type="checkbox"><span class="form-check-label">Deckel</span></label><label class="form-check"><input class="form-check-input" id="v30-electronics" type="checkbox" checked><span class="form-check-label">Elektronik</span></label><label class="form-check"><input class="form-check-input" id="v30-mast" type="checkbox" checked><span class="form-check-label">Mast</span></label></div><canvas role="img" aria-label="Drehbare Montageansicht: Glasfaserantenne nach oben, PG9 nach unten, zwei Sättel am senkrechten Mast. Gehäuse ausblenden zeigt den Kabelweg."></canvas><div class="note">Ziehen zum Drehen · Antenne ausblenden für größere Gehäuseansicht · Elektronik, Buchsen und Antenne vereinfacht · V3.0</div></div><script id="v30-data" type="application/json">__DATA__</script><script>
(()=>{const root=document.getElementById('gateway-v30'),cv=root.querySelector('canvas'),ctx=cv.getContext('2d'),raw=JSON.parse(document.getElementById('v30-data').textContent),controls={antenna:root.querySelector('#v30-ant'),case:root.querySelector('#v30-case'),lid:root.querySelector('#v30-lid'),electronics:root.querySelector('#v30-electronics'),mast:root.querySelector('#v30-mast')};let yaw=-.35,pitch=1.22,W=700,H=520,drag=null,scheduled=false;const shapes=raw.map(s=>{let v=[];for(let i=0;i<s.v.length;i+=3)v.push(s.v.slice(i,i+3));return {...s,v};});
function color(n){const t=document.createElement('span');t.style.color='var('+n+')';root.append(t);const c=getComputedStyle(t).color;t.remove();return (c.match(/[\d.]+/g)||[130,130,130]).slice(0,3).map(Number)}
function paint(){const fg=color('--foreground'),bg=color('--background'),cols={case:fg.map((v,i)=>v*.6+bg[i]*.4),lid:fg.map((v,i)=>v*.7+bg[i]*.3),holders:color('--chart-3'),route:color('--chart-3'),gland:fg.map((v,i)=>v*.36+bg[i]*.64),antenna:color('--muted-foreground'),mast:fg.map((v,i)=>v*.4+bg[i]*.6),electronics:color('--chart-2')};ctx.clearRect(0,0,W,H);const showAnt=controls.antenna.checked,scale=Math.min(W/(showAnt?370:310),H/(showAnt?510:280)),centerZ=showAnt?100:0,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let tris=[];
function proj(p){let x=p[0],y=p[1]+20,z=p[2]-centerZ;let X=x*cy-y*sy,Y=x*sy+y*cy;return [W/2+X*scale,H*.50+(-Y*cp-z*sp)*scale,Y*sp-z*cp]}
for(const s of shapes){if(controls[s.group]&&!controls[s.group].checked)continue;let vs=s.v.map(p=>proj(s.group==='mast'&&!showAnt?[p[0],p[1],p[2]*.6]:p)),base=cols[s.group];for(let i=0;i<s.f.length;i+=3){const a=vs[s.f[i]],b=vs[s.f[i+1]],c=vs[s.f[i+2]],area=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]),shade=.7+.24*Math.min(1,Math.abs(area)/24);tris.push({v:[a,b,c],d:(a[2]+b[2]+c[2])/3,c:base.map(v=>Math.round(v*shade))});}}
tris.sort((a,b)=>b.d-a.d);for(const t of tris){ctx.beginPath();ctx.moveTo(t.v[0][0],t.v[0][1]);ctx.lineTo(t.v[1][0],t.v[1][1]);ctx.lineTo(t.v[2][0],t.v[2][1]);ctx.closePath();ctx.fillStyle='rgb('+t.c.join(',')+')';ctx.fill();}ctx.font='13px system-ui';ctx.fillStyle='rgb('+fg.join(',')+')';ctx.fillText('Antenne oben · PG9 unten',12,H-16);}
function resize(){W=Math.max(280,cv.clientWidth);H=520;const r=devicePixelRatio||1;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0);paint()}new ResizeObserver(resize).observe(cv);Object.values(controls).forEach(c=>c.addEventListener('change',paint));cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,yaw,pitch];cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*.009;pitch=Math.max(.25,Math.min(1.5,drag[3]+(e.clientY-drag[1])*.008));if(!scheduled){scheduled=true;requestAnimationFrame(()=>{scheduled=false;paint()})}});cv.addEventListener('pointerup',()=>drag=null);resize();})();
</script></body></html>
