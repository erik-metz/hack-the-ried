name: kamue-gateway
services:
  basicstation:
    image: ${GATEWAY_IMAGE:-ghcr.io/erik-metz/hack-the-ried-gateway:pilot}
    platform: linux/arm64
    container_name: kamue-basicstation
    restart: unless-stopped
    stop_grace_period: 30s
    devices:
      - /dev/spidev0.0:/dev/spidev0.0
      - /dev/${GPIO_CHIP:-gpiochip0}:/dev/${GPIO_CHIP:-gpiochip0}
    environment:
      GATEWAY_EUI: ${GATEWAY_EUI:?Set the permanent gateway EUI in .env}
      TC_URI: ${TC_URI:-wss://eu1.cloud.thethings.network:8887}
      RESET_GPIO: ${RESET_GPIO:-17}
      GPIO_CHIP: ${GPIO_CHIP:-gpiochip0}
      ANTENNA_GAIN_DBI: ${ANTENNA_GAIN_DBI:-3}
    secrets:
      - source: ttn_gateway_key
        target: tc.key
    tmpfs:
      - /app/config:mode=0700,size=4m
      - /tmp:size=16m
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: kamue-gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: nickfedor/watchtower:1.23.2@sha256:62fb91130ddb493f869cad7e198fa260dd16c5da293ed092cbd5d8781566f7a6
    platform: linux/arm64
    container_name: kamue-gateway-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: kamue-gateway
      WATCHTOWER_MONITOR_ONLY: "false"
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_TIMEOUT: 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: kamue-gateway
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

secrets:
  ttn_gateway_key:
    file: ./secrets/ttn-lns.key
