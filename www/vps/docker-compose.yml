services:
  satellite-collector:
    profiles: [satellites]
    build:
      context: .
      dockerfile: satellite-collector/Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-satellite-collector:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/satellite-heartbeat'); exit(0 if p.exists() and time.time()-p.stat().st_mtime<60 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 1m
      retries: 3
    environment:
      SPACE_TRACK_IDENTITY: ${SPACE_TRACK_IDENTITY:-}
      SPACE_TRACK_PASSWORD: ${SPACE_TRACK_PASSWORD:-}
      SATELLITE_NORAD_IDS: ${SATELLITE_NORAD_IDS:-all}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - timescale_data:/var/lib/postgresql/data

  backend-api:
    image: ghcr.io/erik-metz/hack-the-ried-api:latest
    container_name: backend_api
    working_dir: /app/v1
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --timeout-graceful-shutdown 600
    restart: always
    stop_grace_period: 11m
    environment:
      MEASUREMENT_READ_MODE: ${MEASUREMENT_READ_MODE:-legacy}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY: ${API_KEY:?Set a dedicated ingestion key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set a distinct admin key}
      TTN_APPLICATION_ID: ${TTN_APPLICATION_ID:-}
      TTN_WEBHOOK_USERNAME: ${TTN_WEBHOOK_USERNAME:-}
      TTN_WEBHOOK_PASSWORD: ${TTN_WEBHOOK_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      timescaledb:
        condition: service_healthy

  shake-collector:
    image: ghcr.io/erik-metz/hack-the-ried-shake-collector:latest
    container_name: shake_collector
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - shake_state:/data
    environment:
      SHAKE_NETWORK: ${SHAKE_NETWORK:-AM}
      SHAKE_STATIONS: ${SHAKE_STATIONS:-R498E,R82E7,R79F9,RB012,R021A,R5DFB,RC017,R2852,RB8D1,SC342}
      SHAKE_WS_URL: ${SHAKE_WS_URL:-wss://swarm:ujHsN9qbYiTAx69H@data.raspberryshake.org/caps/}
      SHAKE_INGEST_MODE: ${SHAKE_INGEST_MODE:-direct_db}
      API_URL: http://backend-api:8080/api/v1
      API_KEY: ${API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set a distinct admin key}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SHAKE_SAMPLING_INTERVAL_SEC: ${SHAKE_SAMPLING_INTERVAL_SEC:-5.0}
      SHAKE_STORE_RAW_WAVEFORM: ${SHAKE_STORE_RAW_WAVEFORM:-false}
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  smartcity-collector:
    image: ghcr.io/erik-metz/hack-the-ried-smartcity-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      SMARTCITY_TENANT: ${SMARTCITY_TENANT:-buerstadt}
      SMARTCITY_DASHBOARD_ID: ${SMARTCITY_DASHBOARD_ID:-76a90123-ba53-4d77-be9f-f11ef90dd63a}
      SMARTCITY_ADDITIONAL_DASHBOARD_IDS: ${SMARTCITY_ADDITIONAL_DASHBOARD_IDS:-24c1807c-3c5a-4809-a57e-33baf13751ea,5a1a6650-26ce-4662-9d52-6e59102e1434,26f92cf2-4b45-4856-b0d3-b606ad186e62}
      SMARTCITY_POLL_SECONDS: ${SMARTCITY_POLL_SECONDS:-60}
      SMARTCITY_ENTITY_IDS: ${SMARTCITY_ENTITY_IDS:-}
      SMARTCITY_METRICS: ${SMARTCITY_METRICS:-}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - smartcity_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  nextbike-collector:
    build:
      context: ./nextbike-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-nextbike-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      NEXTBIKE_BASE_URL: ${NEXTBIKE_BASE_URL:-https://maps.nextbike.net/maps/nextbike-live.json}
      NEXTBIKE_CITY_IDS: ${NEXTBIKE_CITY_IDS:-559}
      NEXTBIKE_POLL_SECONDS: ${NEXTBIKE_POLL_SECONDS:-60}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nextbike_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  fuel-collector:
    build:
      context: ./fuel-collector
    image: ghcr.io/erik-metz/hack-the-ried-fuel-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TANKERKOENIG_API_KEY: ${TANKERKOENIG_API_KEY:-}
      FUEL_LATITUDE: ${FUEL_LATITUDE:-49.62}
      FUEL_LONGITUDE: ${FUEL_LONGITUDE:-8.46}
      FUEL_RADIUS_KM: ${FUEL_RADIUS_KM:-25}
      FUEL_POLL_SECONDS: ${FUEL_POLL_SECONDS:-300}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fuel_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  traffic-collector:
    build:
      context: ./traffic-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-traffic-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TRAFFIC_POLL_SECONDS: ${TRAFFIC_POLL_SECONDS:-180}
      TRAFFIC_ROADS: ${TRAFFIC_ROADS:-A67,A5,A6}
    volumes:
      - traffic_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  environment-collector:
    build:
      context: .
      dockerfile: environment-collector/Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-environment-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ENABLE_BLITZORTUNG: ${ENABLE_BLITZORTUNG:-true}
      ENABLE_XWEATHER: ${ENABLE_XWEATHER:-false}
      XWEATHER_CLIENT_ID: ${XWEATHER_CLIENT_ID:-}
      XWEATHER_CLIENT_SECRET: ${XWEATHER_CLIENT_SECRET:-}
      ENVIRONMENT_CYCLE_TIMEOUT_SECONDS: ${ENVIRONMENT_CYCLE_TIMEOUT_SECONDS:-180}
      ENVIRONMENT_POLL_SECONDS: ${ENVIRONMENT_POLL_SECONDS:-300}
      ENABLE_SOIL_FORECAST: ${ENABLE_SOIL_FORECAST:-false}
      SOIL_POLL_SECONDS: ${SOIL_POLL_SECONDS:-3600}
      ENABLE_POLLEN_FORECAST: ${ENABLE_POLLEN_FORECAST:-false}
      POLLEN_POLL_SECONDS: ${POLLEN_POLL_SECONDS:-10800}
      ENABLE_GBIF: ${ENABLE_GBIF:-false}
      GBIF_POLL_SECONDS: ${GBIF_POLL_SECONDS:-86400}
      ENABLE_DISCHARGE_FORECAST: ${ENABLE_DISCHARGE_FORECAST:-false}
      DISCHARGE_POLL_SECONDS: ${DISCHARGE_POLL_SECONDS:-86400}
      ENABLE_ENTSOE: ${ENABLE_ENTSOE:-false}
      ENTSOE_POLL_SECONDS: ${ENTSOE_POLL_SECONDS:-3600}
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:-}
      MEASUREMENT_WEATHER_WRITE_MODE: ${MEASUREMENT_WEATHER_WRITE_MODE:-legacy}
    volumes:
      - environment_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  rast-collector:
    build:
      context: ./rast-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-rast-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RAST_POLL_SECONDS: ${RAST_POLL_SECONDS:-900}
      RAST_ROADS: ${RAST_ROADS:-A67,A5,A6,A659,A61}
    volumes:
      - rast_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  opensensemap-collector:
    build:
      context: ./opensensemap-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-opensensemap-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OPENSENSEMAP_POLL_SECONDS: ${OPENSENSEMAP_POLL_SECONDS:-300}
      OPENSENSEMAP_BBOX: ${OPENSENSEMAP_BBOX:-8.25,49.40,8.80,50.00}
    volumes:
      - opensensemap_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  uba-collector:
    build:
      context: ./uba-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-uba-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UBA_POLL_SECONDS: ${UBA_POLL_SECONDS:-1800}
      UBA_BBOX: ${UBA_BBOX:-8.25,49.40,8.85,50.05}
    volumes:
      - uba_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  ttnmapper-collector:
    build:
      context: ./ttnmapper-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-ttnmapper-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TTNMAPPER_POLL_SECONDS: ${TTNMAPPER_POLL_SECONDS:-900}
      TTNMAPPER_CENTER_LAT: ${TTNMAPPER_CENTER_LAT:-49.64}
      TTNMAPPER_CENTER_LON: ${TTNMAPPER_CENTER_LON:-8.53}
      TTNMAPPER_RADIUS_METERS: ${TTNMAPPER_RADIUS_METERS:-25000}
    volumes:
      - ttnmapper_state:/data
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  emf-collector:
    build:
      context: ./emf-collector
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-emf-collector:latest
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/emf-heartbeat'); exit(0 if p.exists() and time.time()-p.stat().st_mtime<90 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 1m
      retries: 3
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EMF_POLL_SECONDS: ${EMF_POLL_SECONDS:-86400}
      EMF_MIN_LAT: ${EMF_MIN_LAT:-49.50}
      EMF_MAX_LAT: ${EMF_MAX_LAT:-49.80}
      EMF_MIN_LON: ${EMF_MIN_LON:-8.35}
      EMF_MAX_LON: ${EMF_MAX_LON:-8.70}
    depends_on:
      backend-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  archive-worker:
    image: ghcr.io/erik-metz/hack-the-ried-archive-worker:latest
    profiles: ["archives"]
    stop_grace_period: 60s
    volumes:
      - archive_state:/data
    restart: unless-stopped
    environment:
      MEASUREMENT_READ_MODE: ${MEASUREMENT_READ_MODE:-legacy}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      ARCHIVE_PART_MB: ${ARCHIVE_PART_MB:-64}
    depends_on:
      timescaledb:
        condition: service_healthy
  registry-sync-worker:
    build:
      context: ./registry-sync-worker
      dockerfile: Dockerfile
    image: ghcr.io/erik-metz/hack-the-ried-registry-sync-worker:latest
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/registry-sync-heartbeat'); exit(0 if p.exists() and time.time()-p.stat().st_mtime<90 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 3
    volumes:
      - sync_state:/data
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SYNC_TIMEZONE: Europe/Berlin
      SOURCE_MANIFEST: /app/sources.json
      WEBCAM_ARCHIVE_DIR: /data/webcam-snapshots
      WEBCAM_ARCHIVE_MAX_BYTES: ${WEBCAM_ARCHIVE_MAX_BYTES:-5000000000}
      WEBCAM_RETENTION_DAYS: ${WEBCAM_RETENTION_DAYS:-14}
      WEBCAM_ORPHAN_GRACE_SECONDS: ${WEBCAM_ORPHAN_GRACE_SECONDS:-86400}
      DB_CLIENT_ID: ${DB_CLIENT_ID:-}
      DB_API_KEY: ${DB_API_KEY:-}
      RIS_TRIP_CROSSWALK_FILE: ${RIS_TRIP_CROSSWALK_FILE:-}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      ECOSTRESS_RASTER_ENABLED: ${ECOSTRESS_RASTER_ENABLED:-false}
    depends_on:
      timescaledb:
        condition: service_healthy
      backend-api:
        condition: service_healthy

  aircraft-collector:
    build:
      context: ./aircraft-collector
    image: ghcr.io/erik-metz/hack-the-ried-aircraft-collector:latest
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AIRCRAFT_POLL_SECONDS: ${AIRCRAFT_POLL_SECONDS:-15}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time,os; p=pathlib.Path('/tmp/aircraft-heartbeat'); exit(0 if p.exists() and time.time()-p.stat().st_mtime<max(60,float(os.getenv('AIRCRAFT_POLL_SECONDS','15'))*2) else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      timescaledb:
        condition: service_healthy
      backend-api:
        condition: service_healthy

  ais-collector:
    build:
      context: ./ais-collector
    image: ghcr.io/erik-metz/hack-the-ried-ais-collector:latest
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AIS_STREAM_API_KEY: ${AIS_STREAM_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/ais-heartbeat'); exit(0 if p.exists() and time.time()-p.stat().st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      timescaledb:
        condition: service_healthy
      backend-api:
        condition: service_healthy

  rhine-map-collector:
    build:
      context: ./ais-collector
    image: ghcr.io/erik-metz/hack-the-ried-ais-collector:latest
    command: ["xvfb-run", "-a", "python", "map_collector.py"]
    init: true
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RHINE_MAP_INTERVAL_SECONDS: 300
      RHINE_MAP_PROVIDER: ${RHINE_MAP_PROVIDER:?Set the Rhine map provider}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/rhein-map-heartbeat'); exit(0 if p.exists() and time.time()-p.stat().st_mtime<660 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 240s
      retries: 3
    depends_on:
      timescaledb:
        condition: service_healthy
      backend-api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/healthz | grep -q '^ok$'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./healthcheck-nginx.conf:/etc/nginx/conf.d/healthcheck.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    depends_on:
      - backend-api

  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_TIMEOUT=11m
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_MONITOR_ONLY=true

volumes:
  shake_state:
  archive_state:
  sync_state:
  smartcity_state:
  fuel_state:
  nextbike_state:
  traffic_state:
  rast_state:
  opensensemap_state:
  uba_state:
  ttnmapper_state:
  environment_state:
  certbot_www:
  certbot_etc:
  timescale_data:
