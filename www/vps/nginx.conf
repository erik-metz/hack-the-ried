proxy_cache_path /var/cache/nginx/collected levels=1:2 keys_zone=collected:20m max_size=512m inactive=1h;
gzip on;
gzip_types application/json;

# This file is included in nginx's http context.
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;

server {
    listen 80;
    server_name hack-the-ried.duckdns.org open-ried-sens.duckdns.org;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Allow Certbot challenge requests
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hack-the-ried.duckdns.org open-ried-sens.duckdns.org;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hack-the-ried.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hack-the-ried.duckdns.org/privkey.pem;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Recommended SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Re-resolve the Compose service after API containers are replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Public ZIP exports can contain tens of megabytes and may take several
    # minutes to stream. Keep the download connection open through completion.
    location = /api/v1/downloads {
        set $api_backend backend-api:8080;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        send_timeout 600s;
        limit_conn api_connections 10;
    }

    location = /api/v1/movements/stream {
        set $api_backend backend-api:8080;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        limit_conn api_connections 10;
    }

    location = /api/v1/satellites/stream {
        set $api_backend backend-api:8080;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        limit_conn api_connections 10;
    }

    # Only public read endpoints are cacheable. Writes/admin never enter this cache.
    location ~ ^/api/v1/(collected/|movements/latest$|map/collected-layers$|map/sensors$|fuel$|transport/stops/|map-tiles/|collection/status$) {
        set $api_backend backend-api:8080;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_cache collected;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_valid 200 5s;
        # No stale-on-error: expired measurements must become unavailable.
        add_header X-Cache $upstream_cache_status;
    }

    location / {
        set $api_backend backend-api:8080;
        limit_req zone=api_requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn api_connections 10;
        limit_conn_status 429;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
