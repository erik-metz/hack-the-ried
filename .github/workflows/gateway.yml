name: Gateway CI & GHCR
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway.yml'
permissions:
  contents: read
concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-publish:
    name: Validate ARM64 gateway and publish pilot
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install websockets==15.0.1
      - name: Validate configuration and failure paths
        env:
          GATEWAY_EUI: '0102030405060708'
          TC_KEY: 'NNSXS.synthetic-ci-key'
          GATEWAY_COMPOSE_JSON: /tmp/gateway-compose.json
        run: |
          bash -n gateway/scripts/gateway-start gateway/scripts/gateway-healthcheck gateway/scripts/install-host-hardening
          docker compose --env-file gateway/.env.example -f gateway/compose.yml config --format json > "$GATEWAY_COMPOSE_JSON"
          python -m unittest discover -s gateway/tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Build existing forwarder with gateway configuration wrapper
        uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/arm64
          load: true
          tags: kamue-gateway:test
          build-args: VCS_REF=${{ github.sha }}
      - name: Smoke test without radio hardware
        run: |
          docker run --rm --entrypoint /app/artifacts/corecell/station kamue-gateway:test --version
          docker run --rm -v "$PWD/gateway/tests:/app/tests:ro" -v "$PWD/gateway/bridge:/app/bridge:ro" -v "$PWD/gateway/scripts:/app/scripts:ro" --entrypoint python3 kamue-gateway:test -m unittest discover -s /app/tests -p test_spool.py -v
          if docker run --rm -e GATEWAY_EUI=invalid kamue-gateway:test; then
            echo 'Invalid configuration was unexpectedly accepted' >&2
            exit 1
          fi
          docker run --rm --entrypoint bash kamue-gateway:test -euc '
            printf "#!/bin/sh\nexit 0\n" > /app/start
            GATEWAY_EUI=a102030405060708 TC_KEY=NNSXS.synthetic-ci-key TC_URI=wss://eu1.cloud.thethings.network:8887 gateway-start --render-only
            jq -e '\''.station_conf.routerid == "A102030405060708" and .SX1302_conf.radio_0.antenna_gain == 3'\'' /app/config/station.conf
            test "$(cat /app/config/tc.uri)" = ws://127.0.0.1:3001
            grep -q "Authorization: Bearer NNSXS.synthetic-ci-key" /app/config/tc.key
          '
      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/hack-the-ried-gateway" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image (pilot channel only)
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ github.sha }}
        run: |
          docker tag kamue-gateway:test "$IMAGE:sha-$COMMIT"
          docker tag kamue-gateway:test "$IMAGE:pilot"
          docker push "$IMAGE:sha-$COMMIT"
          docker push "$IMAGE:pilot"
          echo "Published ARM64 image: $IMAGE:sha-$COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo 'pilot follows tested main commits; radio/offline operation is not verified by CI.' >> "$GITHUB_STEP_SUMMARY"
