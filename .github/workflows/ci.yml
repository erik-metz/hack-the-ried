name: FastAPI & Docker CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "www/vps/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "www/vps/**"
      - ".github/workflows/ci.yml"

# Grants permission to push packages to GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  validate-fuel-collector:
    name: Fuel collector tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/fuel-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/fuel-collector
      - run: PYTHONPATH=www/vps/fuel-collector python -m pytest -q www/vps/fuel-collector/tests
        env:
          FUEL_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  validate-api-code:
    name: Code Validation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f www/vps/api/requirements.txt ]; then pip install -r www/vps/api/requirements.txt; fi
          pip install ruff pytest

      - name: Lint code with Ruff
        run: |
          ruff check www/vps/api/ --fix

      - name: Test API security and archive catalogue
        run: PYTHONPATH=www/vps/api/v1 python -m unittest discover -s www/vps/api/v1/tests

  validate-shake-collector-code:
    name: Code Validation & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f www/vps/shake-collector/requirements.txt ]; then pip install -r www/vps/shake-collector/requirements.txt; fi
          pip install ruff pytest

      - name: Lint code with Ruff
        run: |
          ruff check www/vps/shake-collector/

      - name: Test collector
        run: PYTHONPATH=www/vps/shake-collector:www/vps/tests python -m pytest -q www/vps/shake-collector/tests

  validate-smartcity-collector:
    name: Smart City collector tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/smartcity-collector/requirements.txt ruff
      - run: ruff check --config www/vps/pyproject.toml www/vps/smartcity-collector
      - run: PYTHONPATH=www/vps/smartcity-collector python -m unittest discover -s www/vps/smartcity-collector/tests
        env:
          SMARTCITY_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          SMARTCITY_TEST_TIMESCALE: "1"
      - run: pip install -r www/vps/api/requirements.txt
      - run: PYTHONPATH=www/vps/api/v1 python -m unittest discover -s www/vps/api/v1/tests -p test_map_sensors.py
        env:
          MAP_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          MAP_TEST_TIMESCALE: "1"

  validate-nextbike-collector:
    name: Nextbike collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/nextbike-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/nextbike-collector
      - run: PYTHONPATH=www/vps/nextbike-collector:www/vps/tests python -m pytest -q www/vps/nextbike-collector/tests

  validate-traffic-collector:
    name: Traffic collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/traffic-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/traffic-collector
      - run: PYTHONPATH=www/vps/traffic-collector:www/vps/tests python -m pytest -q www/vps/traffic-collector/tests

  validate-rast-collector:
    name: Rast collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/rast-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/rast-collector
      - run: PYTHONPATH=www/vps/rast-collector:www/vps/tests python -m pytest -q www/vps/rast-collector/tests

  validate-opensensemap-collector:
    name: OpenSenseMap collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/opensensemap-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/opensensemap-collector
      - run: PYTHONPATH=www/vps/opensensemap-collector:www/vps/tests python -m pytest -q www/vps/opensensemap-collector/tests

  validate-uba-collector:
    name: UBA collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/uba-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/uba-collector
      - run: PYTHONPATH=www/vps/uba-collector:www/vps/tests python -m pytest -q www/vps/uba-collector/tests

  validate-ttnmapper-collector:
    name: TTN Mapper collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/ttnmapper-collector/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/ttnmapper-collector
      - run: PYTHONPATH=www/vps/ttnmapper-collector:www/vps/tests python -m pytest -q www/vps/ttnmapper-collector/tests

  validate-collector-storage:
    name: Collector database contracts
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/api/requirements.txt -r www/vps/shake-collector/requirements.txt -r www/vps/registry-sync-worker/requirements.txt -r www/vps/rast-collector/requirements.txt -r www/vps/opensensemap-collector/requirements.txt -r www/vps/uba-collector/requirements.txt -r www/vps/ttnmapper-collector/requirements.txt -r www/vps/emf-collector/requirements.txt pytest
      - name: Test independent persistence contracts
        run: |
          for service in nextbike traffic shake environment rast opensensemap uba ttnmapper emf; do
            PYTHONPATH=www/vps/$service-collector:www/vps/tests python -m pytest -q www/vps/$service-collector/tests
          done
          PYTHONPATH=www/vps/registry-sync-worker:www/vps/tests python -m pytest -q www/vps/registry-sync-worker/tests
          PYTHONPATH=www/vps/api/v1:www/vps/tests python -m pytest -q www/vps/api/v1/tests/test_collected_database.py -k "status or download"
          PYTHONPATH=www/vps/api/v1:www/vps/tests python -m pytest -q www/vps/api/v1/tests/test_traffic_database.py
          PYTHONPATH=www/vps/api/v1:www/vps/tests python -m pytest -q www/vps/api/v1/tests/test_ingestion_batches.py
          PYTHONPATH=www/vps/api/v1:www/vps/tests python -m pytest -q www/vps/api/v1/tests/test_sensor_integrations.py
          PYTHONPATH=www/vps/api/v1:www/vps/tests python -m pytest -q www/vps/api/v1/tests/test_measurement_core.py www/vps/api/v1/tests/test_measurement_reads.py www/vps/api/v1/tests/test_snapshot_cache.py www/vps/api/v1/tests/test_map_sensors.py www/vps/tests/test_backup_stream.py
        env:
          COLLECTOR_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          COLLECTOR_TEST_TIMESCALE: "1"
          MAP_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          MAP_TEST_TIMESCALE: "1"

  validate-aircraft-collector:
    name: Aircraft collector tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/aircraft-collector/requirements.txt -r www/vps/api/requirements.txt ruff
      - run: ruff check --config www/vps/pyproject.toml www/vps/aircraft-collector
      - run: PYTHONPATH=www/vps/aircraft-collector:www/vps/api/v1:www/vps/tests python -m unittest discover -s www/vps/aircraft-collector/tests
        env:
          COLLECTOR_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          COLLECTOR_TEST_TIMESCALE: "1"

  validate-ais-collector:
    name: AIS collector tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/ais-collector/requirements.txt -r www/vps/api/requirements.txt ruff
      - run: ruff check --config www/vps/pyproject.toml www/vps/ais-collector
      - run: PYTHONPATH=www/vps/ais-collector:www/vps/api/v1:www/vps/tests python -m unittest discover -s www/vps/ais-collector/tests
        env:
          COLLECTOR_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          COLLECTOR_TEST_TIMESCALE: "1"

  validate-archive-worker:
    name: Archive export tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: www/vps/archive-worker/package-lock.json
      - run: npm ci
        working-directory: www/vps/archive-worker
      - run: npm test
        working-directory: www/vps/archive-worker
        env:
          ARCHIVE_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  validate-satellite-collector:
    name: Satellite collector and propagation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r www/vps/satellite-collector/requirements.txt -r www/vps/api/requirements.txt ruff pytest
      - run: ruff check --config www/vps/pyproject.toml www/vps/satellite-collector www/vps/api/v1/satellite_orbits.py www/vps/api/v1/endpoints/satellite_tracking.py
      - run: PYTHONPATH=www/vps/satellite-collector:www/vps/api/v1 python -m pytest -q www/vps/satellite-collector/tests
        env:
          SATELLITE_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  build-and-push-ghcr:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    needs:
      - validate-fuel-collector
      - validate-api-code
      - validate-satellite-collector
      - validate-shake-collector-code
      - validate-smartcity-collector
      - validate-nextbike-collector
      - validate-traffic-collector
      - validate-rast-collector
      - validate-opensensemap-collector
      - validate-uba-collector
      - validate-ttnmapper-collector
      - validate-collector-storage
      - validate-ais-collector
      - validate-aircraft-collector
      - validate-archive-worker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image Satellite Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps
          file: ./www/vps/satellite-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-satellite-collector:latest

      - name: Build and Push Docker Image Aircraft Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/aircraft-collector
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-aircraft-collector:latest

      - name: Build and Push Docker Image AIS Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/ais-collector
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-ais-collector:latest

      - name: Build and Push Docker Image API
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/api
          file: ./www/vps/api/v1/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-api:latest

      - name: Build and Push Docker Image Shake Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/shake-collector
          file: ./www/vps/shake-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-shake-collector:latest

      - name: Build and Push Docker Image Smart City Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/smartcity-collector
          file: ./www/vps/smartcity-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-smartcity-collector:latest

      - name: Build and Push Docker Image Nextbike Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/nextbike-collector
          file: ./www/vps/nextbike-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-nextbike-collector:latest

      - name: Build and Push Docker Image Traffic Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/traffic-collector
          file: ./www/vps/traffic-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-traffic-collector:latest

      - name: Build and Push Docker Image Rast Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/rast-collector
          file: ./www/vps/rast-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-rast-collector:latest

      - name: Build and Push Docker Image OpenSenseMap Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/opensensemap-collector
          file: ./www/vps/opensensemap-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-opensensemap-collector:latest

      - name: Build and Push Docker Image UBA Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/uba-collector
          file: ./www/vps/uba-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-uba-collector:latest

      - name: Build and Push Docker Image TTN Mapper Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/ttnmapper-collector
          file: ./www/vps/ttnmapper-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-ttnmapper-collector:latest

      - name: Build and Push Docker Image Archive Worker
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/archive-worker
          file: ./www/vps/archive-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-archive-worker:latest

      - name: Build and Push Docker Image Environment Collector
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps
          file: ./www/vps/environment-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-environment-collector:latest

      - name: Build and Push Docker Image Registry Sync Worker
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/registry-sync-worker
          file: ./www/vps/registry-sync-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-registry-sync-worker:latest

      - name: Build and push EMF collector image
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/emf-collector
          file: ./www/vps/emf-collector/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-emf-collector:latest

      - name: Build and push fuel collector image
        uses: docker/build-push-action@v6
        with:
          context: ./www/vps/fuel-collector
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hack-the-ried-fuel-collector:latest
