name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "www/open-ried-sens/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "www/open-ried-sens/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  validate-frontend-security:
    name: Frontend security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: www/open-ried-sens/package-lock.json
      - run: npm ci
        working-directory: www/open-ried-sens
      - run: npm run test:security
        working-directory: www/open-ried-sens
      - run: npm run test:map
        working-directory: www/open-ried-sens
      - run: npm run test:sources
        working-directory: www/open-ried-sens
      - run: npx eslint app/quellen/page.tsx app/quellen/sourceInfo.ts app/quellen/sourceStatus.ts
        working-directory: www/open-ried-sens
      - run: npm run test:regional
        working-directory: www/open-ried-sens
      - run: npm run test:events
        working-directory: www/open-ried-sens
      - run: node --test tests/mapPresets.test.mjs tests/urlState.test.mjs tests/satelliteData.test.mjs
        working-directory: www/open-ried-sens
      - run: npx eslint app/components/MapSatelliteLayer.tsx lib/satelliteData.ts app/api/satellites
        working-directory: www/open-ried-sens
      - run: npm run build
        working-directory: www/open-ried-sens
        env:
          BACKEND_API_URL: http://127.0.0.1:8080
          ADMIN_PASSWORD: ci-placeholder
          ADMIN_SESSION_SECRET: ci-placeholder-session-secret
          BACKEND_ADMIN_API_KEY: hack_the_ried_admin_ci-placeholder

