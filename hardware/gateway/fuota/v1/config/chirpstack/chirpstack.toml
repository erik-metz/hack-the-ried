[logging]
level="info"
[postgresql]
dsn="postgres://chirpstack:$POSTGRES_PASSWORD@postgres/chirpstack?sslmode=disable"
max_open_connections=5
[redis]
servers=["redis://redis/"]
[network]
net_id="000000"
enabled_regions=["eu868"]
[api]
bind="0.0.0.0:8080"
secret="$API_SECRET"
[integration]
enabled=["mqtt"]
[integration.mqtt]
server="tcp://mosquitto:1883/"
json=true
