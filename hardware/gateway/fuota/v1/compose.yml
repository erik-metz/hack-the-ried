name: kamue-fuota-v1
services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chirpstack
      POSTGRES_DB: chirpstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare.py first}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./config/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U chirpstack -d chirpstack"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
  chirpstack:
    image: chirpstack/chirpstack:4.20.0
    restart: unless-stopped
    command: -c /etc/chirpstack
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare.py first}
      API_SECRET: ${API_SECRET:?Run prepare.py first}
    volumes:
      - ./config/chirpstack:/etc/chirpstack:ro
    ports:
      - 127.0.0.1:8085:8080
  gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4.1.2
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/config.toml
    depends_on:
      - mosquitto
    volumes:
      - ./config/gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    ports:
      - 127.0.0.1:3002:3001
volumes:
  postgres:
  redis:
